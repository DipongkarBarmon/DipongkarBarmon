<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <style>
    .cell { rx: 3px; ry: 3px; width: 11px; height: 11px; }
    .c0 { fill: #161b22; }
    .c1 { fill: #0e4429; }
    .c2 { fill: #006d32; }
    .c3 { fill: #26a641; }
    .c4 { fill: #39d353; }
    .cp1 { fill: #6e40c9; }
    .cp2 { fill: #a371f7; }
    .cp3 { fill: #d2a8ff; }

    @keyframes snakeMove {
      0%   { transform: translate(0px, 0px); }
      25%  { transform: translate(120px, 45px); }
      50%  { transform: translate(240px, -15px); }
      75%  { transform: translate(360px, 30px); }
      100% { transform: translate(480px, 0px); }
    }
    .snake-body {
      animation: snakeMove 8s linear infinite alternate;
    }
  </style>

  <rect width="850" height="160" rx="8" fill="#0d1117" />

